<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementor Section Copier</title>
  <style>
    :root {
      --bg: #141419;
      --panel: #1e1e24;
      --border: #33333d;
      --text: #f2f2f6;
      --muted: #9a9aa6;
      --accent: #e03a8e;
      --accent-hover: #c72f7b;
      --green: #4cd97a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 15px; font-weight: 700; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); margin-top: 4px; font-size: 12px; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      color: #fff;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: #33333d; }
    .btn-secondary:hover:not(:disabled) { background: #43434f; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { width: auto; flex: 1; }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-toggle label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }
    .mode-toggle input { accent-color: var(--accent); }
    .mode-toggle label.active { border-color: var(--accent); color: var(--text); background: rgba(224, 58, 142, 0.1); }
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }
    .status.ok { color: var(--green); }
    .status.err { color: #ff7a7a; }
    .capture-meta { font-size: 11px; color: var(--muted); line-height: 1.5; word-break: break-all; }
    .capture-meta strong { color: var(--text); }
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Elementor <span>Section Copier</span></h1>
    <p class="subtitle">Capture seções de qualquer site e cole no Elementor.</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Estrutura</h2>
      <div class="mode-toggle">
        <label id="mode-container-label">
          <input type="radio" name="mode" value="container" id="mode-container">
          Container (Flexbox)
        </label>
        <label id="mode-section-label">
          <input type="radio" name="mode" value="section" id="mode-section">
          Seção clássica
        </label>
      </div>
      <h2 style="margin-top: 12px;">Conversão</h2>
      <div class="mode-toggle">
        <label id="conv-native-label">
          <input type="radio" name="conversion" value="native" id="conv-native">
          Widgets nativos
        </label>
        <label id="conv-html-label">
          <input type="radio" name="conversion" value="html" id="conv-html">
          HTML único
        </label>
      </div>
      <button id="btn-start" class="btn-primary">Inspecionar página</button>
      <p class="status" id="inspector-status"></p>
    </section>

    <section class="card">
      <h2>2. Captura atual</h2>
      <div id="capture-info" class="capture-meta">Nenhuma captura ainda.</div>
      <div class="divider"></div>
      <div class="btn-row" style="margin-top: 10px;">
        <button id="btn-copy" class="btn-secondary" disabled>Copiar JSON</button>
        <button id="btn-download" class="btn-secondary" disabled>Baixar .json</button>
      </div>
      <div class="btn-row" style="margin-top: 8px;">
        <button id="btn-inject" class="btn-secondary" disabled>Colar no Elementor</button>
      </div>
      <p class="status" id="action-status"></p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
